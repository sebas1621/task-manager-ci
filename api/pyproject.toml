[project]
name = "task-manager-api"
version = "0.1.0"
description = "Task manager REST API used to demonstrate Docker and continuous integration."
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "D", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["app"]
