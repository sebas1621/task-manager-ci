# Two communicating containers: the FastAPI app (api) and PostgreSQL (db).
# Start everything with: docker compose up -d --build
name: task-manager-ci

services:
  db:
    # Exact pinned version (never "latest").
    image: postgres:17.11-alpine3.24
    # Values come from .env; ":?" fails loudly if one is missing.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # Named volume: data survives "docker compose down" (removed by "down -v").
      - tasks-db-data:/var/lib/postgresql/data
    # No "ports:" on purpose: only the api container needs the DB, through
    # tasks-net. Not publishing 5432 keeps the database off the host network.
    healthcheck:
      # "$$" defers expansion to the container shell, where the vars exist.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - tasks-net

  api:
    build:
      context: ./api
    # Explicit local tag; the image never relies on "latest".
    image: task-manager-api:local
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      # The SERVICE NAME "db" is resolved by Docker's DNS on tasks-net
      # (never localhost or a fixed IP).
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        # Wait until pg_isready passes, not just until the container starts.
        condition: service_healthy
    healthcheck:
      # The image has no curl, so probe /health (which runs SELECT 1) with Python.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      # Allows time for "alembic upgrade head" at startup.
      start_period: 20s
    restart: unless-stopped
    networks:
      - tasks-net

networks:
  tasks-net:
    driver: bridge

volumes:
  tasks-db-data:
